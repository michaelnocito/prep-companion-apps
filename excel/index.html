  <title>Excel Analyst Sprint — Free Excel Practice Game for Data Analysts</title>
  <link rel="canonical" href="https://michaelnocito.github.io/prep-companion-apps/excel/">
  <meta name="description" content="Free Excel practice game for aspiring data analysts. 14 bite-size lessons — type real formulas from =SUM to =XLOOKUP with instant feedback, then turn the numbers into a business recommendation. No install, no account." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Nunito:wght@600;700;800&family=Cousine:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --fa:#6fd3ee;--fb:#1aa3c7;--fc:#0f86a8;--fink:#ffffff;--fsoft:#dff3fa;--fdeep:#0a5f78;
      --bg:#ffffff;--card:#ffffff;--ink:#203040;--muted:#5a6b7a;--faint:#7d8e9b;--line:#d7e3ea;--sep:#eef3f6;--chipbg:#eef5f8;
      --pf:#4d5d6c;--pe:#e3e9ee;--pcur:#9aa7b2;--todo:#c9d3db;
      --tile:var(--fsoft);--tdeep:var(--fdeep);
      --warm:#fff3dc;--warm-ink:#8a5a00;--code:#f3f8fb;
      --ok-a:#c9eda6;--ok-b:#9ad466;--ok-ink:#1f3d0c;--ok-deep:#2f6b0f;
      --bad-a:#fbc3cf;--bad-b:#f593aa;--bad-ink:#5a0f22;--bad:#b0243f;--bad-soft:#fde6ec;
      --shadow:0 2px 8px rgba(20,50,80,.08);
      --round:"Varela Round","Nunito",system-ui,sans-serif;
      --sans:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
      --mono:"Cousine",ui-monospace,Consolas,Menlo,monospace;
      color-scheme:light;
    }
    html[data-theme="dark"]{
      --bg:#16182a;--card:#222540;--ink:#f1f3fb;--muted:#aab0c8;--faint:#8e95b0;--line:#353a5e;--sep:#2d3152;--chipbg:#2b2f50;
      --pf:#c3ccd4;--pe:#353a5e;--pcur:#7d8796;--todo:#4a5078;
      --tile:color-mix(in srgb,var(--fb) 22%,#222540);--tdeep:var(--fa);
      --warm:#3a3020;--warm-ink:#ffd27a;--code:#1b1e36;
      --bad:#ff9db4;--bad-soft:#3a1d29;
      --shadow:0 2px 8px rgba(0,0,0,.3);
      color-scheme:dark;
    }
    *{box-sizing:border-box}
    html,body{margin:0;color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
    html{background:var(--bg)}
    body{background:linear-gradient(var(--tile),var(--bg) 260px) no-repeat;background-color:var(--bg)}
    a{color:var(--tdeep)}
    button{font:inherit;color:inherit}
    :focus-visible{outline:3px solid var(--fb);outline-offset:2px}
    h1:focus{outline:none}
    .app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
    .top{display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 16px 6px}
    .brand{font-family:var(--round);font-size:22px;color:var(--tdeep);flex:1;line-height:1.2}
    main{flex:1;padding:6px 16px 18px;display:flex;flex-direction:column;gap:12px}
    .gloss{position:relative;overflow:hidden}
    .gloss::before{content:"";position:absolute;left:8px;right:8px;top:3px;height:42%;border-radius:16px;background:linear-gradient(rgba(255,255,255,.6),rgba(255,255,255,0));pointer-events:none}
    .gloss>*{position:relative}
    .pill{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border:0;border-radius:999px;background:var(--card);color:var(--ink);text-decoration:none;font-size:13px;font-weight:800;box-shadow:0 2px 6px rgba(20,50,80,.1);cursor:pointer;flex:none}
    .xbtn{width:36px;height:36px;flex:none;border:0;border-radius:50%;background:var(--card);color:var(--muted);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(20,50,80,.1);cursor:pointer}
    .go{flex:1;min-height:56px;border:0;border-radius:999px;background:linear-gradient(160deg,var(--fa),var(--fb) 60%,var(--fc));color:var(--fink);font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;padding:6px 18px;cursor:pointer;box-shadow:0 5px 12px color-mix(in srgb,var(--fb) 35%,transparent);text-decoration:none}
    .go:disabled{opacity:.45;cursor:default}
    .soft{min-height:56px;padding:0 16px;flex:none;border:0;border-radius:999px;background:var(--chipbg);color:var(--ink);font-weight:800;font-size:14px;cursor:pointer}
    .dock{position:sticky;bottom:0;z-index:5;background:var(--card);border-radius:26px 26px 0 0;box-shadow:0 -6px 18px rgba(20,50,80,.1);padding:12px 16px calc(16px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center}
    .dock.ok{background:linear-gradient(160deg,var(--ok-a),var(--ok-b));color:var(--ok-ink)}
    .dock.bad{background:linear-gradient(160deg,var(--bad-a),var(--bad-b));color:var(--bad-ink)}
    .dock .cont{min-height:54px;border:0;border-radius:999px;background:#fff;color:#203040;font-weight:800;font-size:17px;cursor:pointer}
    h1{margin:0;font-family:var(--round);font-weight:400;font-size:26px;line-height:1.15}
    .eyebrow{font-size:12px;font-weight:800;color:var(--tdeep)}
    .label{font-size:12px;font-weight:800;color:var(--muted)}
    .card{background:var(--card);border-radius:18px;box-shadow:var(--shadow)}
    .stat{background:var(--tile);border-radius:14px;padding:10px 10px 8px;display:flex;flex-direction:column;min-width:0}
    .stat b{font-family:var(--round);font-weight:400;font-size:21px;color:var(--tdeep);line-height:1.2}
    .stat span{font-size:11px;font-weight:800;color:var(--muted)}
    .tilebtn{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border:0;border-radius:18px;background:var(--tile);color:var(--ink);text-align:left;cursor:pointer;text-decoration:none}
    .tilebtn.warm{background:var(--warm)}
    .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .tiles3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
    .steps{flex:1;display:flex;gap:4px}
    .steps span{flex:1;height:6px;border-radius:999px;background:var(--pe)}
    .steps span.f{background:var(--pf)}
    .steps span.c{background:var(--pcur)}
    .mini{display:block;height:6px;border-radius:3px;background:var(--pe);overflow:hidden}
    .mini i{display:block;height:100%;background:var(--pf)}
    .dot{width:30px;height:32px;padding:0;border:0;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
    .dot span{position:relative;width:16px;height:16px;border-radius:50%;box-shadow:inset 0 -2px 3px rgba(0,0,0,.2)}
    .dot span::after{content:"";position:absolute;left:3px;top:2px;width:7px;height:4px;border-radius:50%;background:rgba(255,255,255,.7)}
    .dot[aria-pressed="true"] span{outline:2px solid var(--tdeep);outline-offset:2px}
    .opt{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px 14px;border:2px solid var(--line);border-radius:18px;background:var(--card);cursor:pointer;font-weight:700}
    .opt.pick{border-color:var(--fb);background:var(--tile)}
    .opt.right{border-color:#7cc242;background:#e4f5d3;color:#203040}
    .opt.wrong{border-color:#e44a6c;background:#fde6ec;color:#203040}
    .warmnote{padding:8px 12px;border-radius:12px;background:var(--warm);color:var(--warm-ink);font-size:14px}
    @media (max-width:360px){h1{font-size:23px}}
    @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

    /* ── App-specific ── */
    details[open] .colsum{display:none}
    .card.pad>.lrow:first-child{border-top:0}
    .ttl{font-family:var(--round);font-size:18px;flex:1;min-width:0}
    .count{font-size:12px;font-weight:800;color:var(--muted);flex:none}
    .flavors{display:flex;align-items:center;gap:0}
    .fname{font-size:13px;font-weight:800;color:var(--muted);margin-left:6px;flex:1}
    .pad{padding:14px 16px}
    .card p{margin:0}
    .card p+p{margin-top:8px}
    summary{list-style:none;cursor:pointer}
    summary::-webkit-details-marker{display:none}
    .sumrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;font-weight:800;font-size:14px}
    .chev{flex:none;transition:transform .2s;color:var(--muted)}
    details[open]>summary .chev,[aria-expanded="true"] .chev{transform:rotate(90deg)}
    .colsum{display:block;font-family:var(--mono);font-size:12px;color:var(--muted);padding:0 16px 12px;line-height:1.5}
    .allbtn{display:flex;flex-direction:column;gap:10px;width:100%;border:0;background:none;padding:14px 16px;cursor:pointer;text-align:left;color:inherit;border-radius:18px}
    .allbtn .sumrow{padding:0}
    .units{padding:0 16px 14px;display:flex;flex-direction:column;gap:12px}
    .uhead{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:800;margin-bottom:2px}
    .uhead span{color:var(--muted)}
    .lrow{display:flex;gap:10px;align-items:center;width:100%;min-height:44px;padding:6px 2px;border:0;border-top:1px solid var(--sep);background:none;text-align:left;cursor:pointer;font-weight:700;font-size:14px;color:var(--ink)}
    .lrow:disabled{cursor:default;color:var(--faint)}
    .mark{width:22px;height:22px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center}
    .mark.done{background:var(--pf);color:var(--card)}
    .mark.next{border:3px solid var(--fb)}
    .mark.todo{border:2px solid var(--todo)}
    .tw{overflow:auto;padding:0 12px 12px}
    .tcap{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--muted);margin:6px 0 3px}
    table.sheet{border-collapse:collapse;font-family:var(--mono);font-size:13px;min-width:100%}
    .sheet th,.sheet td{border:1px solid var(--line);padding:3px 8px;text-align:left;white-space:nowrap}
    .sheet th{background:var(--chipbg);font-weight:700}
    .null{color:var(--faint);font-style:italic}
    pre.code{margin:6px 0 8px;padding:10px 12px;background:var(--code);border-radius:12px;font-family:var(--mono);font-size:13.5px;white-space:pre-wrap;word-break:break-word}
    code{font-family:var(--mono);font-size:.9em;background:var(--code);padding:1px 4px;border-radius:5px;word-break:break-word}
    .warmnote code,.hint code{background:rgba(255,255,255,.55)}
    html[data-theme="dark"] .warmnote code,html[data-theme="dark"] .hint code{background:rgba(0,0,0,.25)}
    .warmnote b{display:block;font-size:12px}
    .prompt{font-size:22px}
    .opts{display:flex;flex-direction:column;gap:10px}
    .ring{width:22px;height:22px;flex:none;border-radius:50%;border:2px solid var(--todo);margin-top:1px}
    .opt.pick .ring{border:7px solid var(--fb)}
    .editor{display:block;width:100%;min-height:96px;margin-top:4px;padding:12px 14px;border:2px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);font-family:var(--mono);font-size:16px;line-height:1.45;resize:vertical}
    .editor:focus{outline:none;border-color:var(--fb)}
    .editor.prose{font-family:var(--sans);font-weight:600}
    .rwrap{padding:10px 12px;max-height:260px}
    details.hint{background:var(--warm);color:var(--warm-ink);border-radius:12px;font-size:14px}
    details.hint>summary{padding:10px 12px;font-weight:800}
    details.hint p{padding:0 12px 10px;margin:0}
    .kit{font-size:13px;font-weight:800;align-self:flex-start}
    .dock.fb{flex-direction:column;align-items:stretch;gap:10px}
    .fbt{margin:0;font-weight:700;max-height:34vh;overflow:auto}
    .fbt b{display:block;font-family:var(--round);font-weight:400;font-size:21px}
    .whyl{margin:0;font-size:13px;font-weight:700;opacity:.9}
    .dock.ok{animation:pop .3s ease-out}
    .dock.bad{animation:shake .3s}
    @keyframes pop{0%{transform:scale(.97)}60%{transform:scale(1.01)}100%{transform:none}}
    @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
    .meter{display:flex;flex-direction:column;gap:6px}
    .meter+.meter{margin-top:12px}
    .mrow{display:flex;justify-content:space-between;font-weight:800;font-size:14px}
    .mini.big{height:10px;border-radius:5px}
    .donebadge{width:84px;height:84px;border-radius:50%;margin:6px auto 0;background:linear-gradient(160deg,var(--fa),var(--fb) 60%,var(--fc));display:flex;align-items:center;justify-content:center;color:var(--fink);box-shadow:0 6px 16px color-mix(in srgb,var(--fb) 35%,transparent)}
    .center{text-align:center}
    .search{display:flex;gap:8px}
    .search input{flex:1;min-width:0;min-height:48px;border:2px solid var(--line);border-radius:999px;padding:0 16px;background:var(--card);color:var(--ink);font:inherit;font-weight:700}
    .search input:focus{outline:none;border-color:var(--fb)}
    .soft.sm{min-height:48px}
    .gpart{padding:0 16px 12px}
    .gpart b{display:block;font-size:13px;color:var(--tdeep)}
    .gpart p{margin:2px 0 0;font-size:15px}
    .tilebtn b{font-family:var(--round);font-weight:400;font-size:18px;color:var(--tdeep);line-height:1.2}
    .tilebtn span{font-size:12px;font-weight:800;color:var(--muted)}
    .ach{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:18px;background:var(--tile)}
    .ach b{font-family:var(--round);font-weight:400;font-size:17px;color:var(--tdeep)}
    .ach span{font-size:12px;font-weight:800;color:var(--muted)}
    .ach.locked{background:var(--chipbg)}
    .ach.locked b{color:var(--muted)}
    .coffee{position:relative;height:150px;border-radius:18px;background:var(--tile);overflow:hidden}
    .counter{position:absolute;left:10%;right:10%;bottom:14%;height:50px;background:#c99a6b;border-radius:16px 16px 8px 8px}
    .cup{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:66px;height:56px;border-radius:0 0 18px 18px;background:#fff;border:3px solid #6b4b32;cursor:pointer;padding:0}
    .cup::before{content:"";position:absolute;left:5px;right:5px;top:5px;height:12px;border-radius:6px;background:#8a5a33}
    .cup::after{content:"";position:absolute;right:-21px;top:10px;width:18px;height:24px;border:4px solid #6b4b32;border-left:0;border-radius:0 14px 14px 0}
    .bean{position:absolute;width:14px;height:14px;border-radius:50%;background:#7a4d2d;animation:fall .7s ease-in forwards}
    @keyframes fall{to{transform:translateY(40px);opacity:0}}
    .ver{font-size:12px;color:var(--faint);text-align:center;margin:0}
    .foot{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px;text-align:center;padding:4px 0 2px}
    .foot p{margin:0}
    .foot a{font-weight:700}
    .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;margin:-1px}
    #fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
    .pt{position:absolute;left:50%;top:40%;width:9px;height:9px;border-radius:2px;animation:blast .9s ease-out forwards}
    @keyframes blast{to{transform:translate(var(--dx),var(--dy)) rotate(260deg);opacity:0}}
    .hero{padding:18px 18px 16px;cursor:pointer;display:flex;flex-direction:column;gap:6px;border:2px solid color-mix(in srgb,var(--fb) 30%,transparent)}
    .hero h1{font-size:30px}
    .linkbtn{border:0;background:none;padding:6px 0 0;color:var(--tdeep);font-weight:800;font-size:13px;cursor:pointer;align-self:flex-start;text-decoration:underline}
    .rowbtn{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;border:0;background:none;padding:10px 16px;cursor:pointer;text-align:left;color:inherit;border-radius:18px;font-weight:800;font-size:14px}
    .rowbtn .grow{flex:1}
    .rowbtn .mini{width:90px}
    .rowbtn .cnt{color:var(--muted);font-size:13px}
    .rowbody{padding:0 16px 14px;display:flex;flex-direction:column;gap:10px}
    .press{transition:transform .1s ease,box-shadow .1s ease}
    .press:active{transform:translateY(3px)}
    .raised{box-shadow:0 4px 0 color-mix(in srgb,var(--fb) 28%,var(--line)),0 3px 12px rgba(20,50,80,.10)}
    .raised:active{box-shadow:0 1px 0 color-mix(in srgb,var(--fb) 28%,var(--line)),0 2px 6px rgba(20,50,80,.08)}
    .hero{flex-direction:row;align-items:center;gap:12px;padding:16px;border:0}
    .hero .htext{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
    .hero h1{font-size:28px}
    .chips{display:flex;gap:6px;flex-wrap:wrap}
    .chip{display:inline-flex;align-items:center;height:26px;white-space:nowrap;padding:0 10px;border-radius:999px;font-size:12px;font-weight:800;background:linear-gradient(160deg,var(--fa),var(--fb) 60%,var(--fc));color:var(--fink)}
    .chip.unit{background:var(--tile);color:var(--tdeep)}
    .arrow{width:52px;height:52px;flex:none;border-radius:50%;background:linear-gradient(160deg,var(--fa),var(--fb) 60%,var(--fc));color:var(--fink);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px color-mix(in srgb,var(--fb) 40%,transparent)}
    .storycard{padding:14px 16px 12px;display:flex;flex-direction:column;gap:8px}
    .storyhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .storylink{display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:999px;background:var(--tile);color:var(--tdeep);font-size:12px;font-weight:800;text-decoration:none}
    .storyrow{display:flex;gap:12px;align-items:center}
    .storyrow p,.ask p{margin:0;font-weight:700;font-size:15px;line-height:1.4}
    .storyrow p{flex:1}
    .ask{background:var(--tile);border-radius:16px;padding:9px 12px}
    .unitbar{flex:none;margin-top:2px}
    .s-a{fill:var(--fa)} .s-b{fill:var(--fb)} .s-c{fill:var(--fc)}
    .s-card{fill:var(--card)} .s-line{stroke:var(--line);stroke-width:2;fill:none}
    .s-ink{fill:#203040} .s-skin{fill:#f2c9a5} .s-hair{fill:#4a2f25}
    .fs{stroke:#203040;stroke-width:2.4;fill:none;stroke-linecap:round}
    .s-stroke{stroke:#203040;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .rowicon{width:38px;height:38px;flex:none;border-radius:12px;background:linear-gradient(160deg,var(--fa),var(--fb) 60%,var(--fc));color:var(--fink);display:flex;align-items:center;justify-content:center}
    .rowtext{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
    .rowtext small{font-size:12px;font-weight:700;color:var(--muted)}
    .rowtext .mini{width:100%;max-width:200px}
    .palette{display:flex;align-items:center;gap:0;margin:0 16px 4px;padding:6px 10px;border-radius:999px;background:var(--card);box-shadow:var(--shadow)}
    .introhead{display:flex;align-items:flex-start;gap:12px}
    .introhead .htext{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}

<body>
<div id="fx" aria-hidden="true"></div>
<div id="live" class="sr-only" aria-live="polite"></div>
<div class="app" id="app">
  <header class="top" id="top"></header>
  <div class="palette" id="palette" role="group" aria-label="Colors and light mode" hidden></div>
<div class="palhint" id="palhint" data-for="palette" role="note" hidden><span><b>New here?</b> Tap a color to make it yours. It follows you to every page.</span><button type="button" aria-label="Got it, hide the color tip">Got it</button></div>
  <main id="screen"><noscript><p>This game needs JavaScript turned on.</p></noscript></main>
  <div class="dock" id="dock"></div>
</div>
<script>
(() => {
  'use strict';
  const VERSION = '1.12.0';
  const KEY = 'excelSprint.v1';
  const THEME_KEY = 'candy.theme.v1';
  const OLD_THEME_KEY = 'excelSprint.theme.v1';
  const KIT_URL = 'https://michaelnocito.github.io/analyst-prep-kit/excel/';

  /* ── Look ── */
  const FLAVORS = [
    { id: "aqua", name: "Aqua", a: "#6fd3ee", b: "#1aa3c7", c: "#0f86a8", ink: "#ffffff", soft: "#dff3fa", deep: "#0a5f78" },

    { id: "lime", name: "Lime", a: "#b5e58a", b: "#7cc242", c: "#5ea52a", ink: "#1f3d0c", soft: "#eaf7dc", deep: "#2f6b0f" },

    { id: "blueberry", name: "Blueberry", a: "#94b8f5", b: "#3f7be0", c: "#2a5fc0", ink: "#ffffff", soft: "#e3ecfc", deep: "#1d4590" },
    { id: "black", name: "Black", a: "#5c5c66", b: "#2b2b31", c: "#111114", ink: "#ffffff", soft: "#ececef", deep: "#18181b" },
    { id: "slate", name: "Slate", a: "#a3b1bf", b: "#5f6f80", c: "#435160", ink: "#ffffff", soft: "#e8edf2", deep: "#2f3b48" },
    { id: "matrix", name: "Matrix", a: "#4dff88", b: "#00c853", c: "#00872f", ink: "#001a08", soft: "#0b2414", deep: "#4dff88" }

  const IC = {

    chev: '<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>',
    moon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>',
    palette: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.2 0 1.8-.8 1.8-1.7 0-1.2-1-1.6-1-2.6 0-1 .8-1.7 1.9-1.7H17a4 4 0 0 0 4-4C21 6.6 17 3 12 3z"/><circle cx="7.5" cy="11" r="1.2"/><circle cx="10.5" cy="7" r="1.2"/><circle cx="15" cy="7.5" r="1.2"/></svg>',
    arrow: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>',
    path: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.5 6H15a3 3 0 0 1 0 6H9a3 3 0 0 0 0 6h6.5"/></svg>',
    star: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>',
    info: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>',
    sun: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
  };

  /* ── The practice sheet (one source for the grid on screen and the formulas) ── */
  const HEAD = ['Lead', 'Region', 'Calls', 'Revenue', 'Status'];
  const SHEET = [HEAD,
    ['Larkfield', 'East', 4, 1200, 'Warm'], ['BluePeak', 'West', 6, 850, 'Hot'], ['Maple Desk', 'South', 3, 990, 'Cold'], ['Iron Harbor', 'East', 8, 2100, 'Hot'],
    ['Cobalt Labs', 'West', 2, 700, 'Cold'], [' Sunfield ', 'South', 5, 1750, 'Hot'], ['Pinecrest', 'East', 0, 300, 'Warm'], ['Quartz & Co', 'West', 7, 1500, 'Warm']];
  /* A hidden copy of the sheet with some cells changed, used only for grading. */
  const tweak = edits => { const g = SHEET.map(r => r.slice()); Object.entries(edits).forEach(([a, v]) => { g[+a.slice(1) - 1][a.charCodeAt(0) - 65] = v; }); return g; };
  const REV = tweak({ D2: 1300, D3: 875, D4: 1010, D5: 2250, D6: 640, D7: 1810, D8: 410, D9: 1395 });

  /* ── Formula evaluator: own parser, no eval. Grades the result, not the text typed. ── */
  const XL = (() => {
    const err = code => ({ err: code });
    const isErr = v => !!v && typeof v === 'object' && 'err' in v;
    const isRange = v => !!v && typeof v === 'object' && 'r1' in v;
    class Stop extends Error { constructor(kind, msg, code) { super(msg); this.stop = true; this.kind = kind; this.code = code || null; } }
    const MAX_LEN = 300, MAX_CELLS = 20000, MAX_DEPTH = 40;
    const ARITY = { SUM: [1, 99], AVERAGE: [1, 99], IF: [2, 3], COUNTIF: [2, 2], IFERROR: [2, 2], TRIM: [1, 1], XLOOKUP: [3, 4], INDEX: [2, 3], MATCH: [2, 3], VLOOKUP: [3, 4] };
    const LATER = /^(MAX|MIN|COUNT|COUNTA|COUNTIFS|SUMIF|SUMIFS|AVERAGEIF|AVERAGEIFS|ROUND|ROUNDUP|ROUNDDOWN|IFS|AND|OR|NOT|LEFT|RIGHT|MID|LEN|UPPER|LOWER|PROPER|CONCAT|CONCATENATE|TEXTJOIN|HLOOKUP|SUMPRODUCT|IFNA|UNIQUE|SORT|FILTER|CLEAN|SUBSTITUTE|VALUE|TEXT|MEDIAN|ABS|INT|XMATCH)$/;

    /* Curly quotes and look-alike signs from phone keyboards become the plain ones. */
    const clean = s => String(s).replace(/[“”„‟″]/g, '"').replace(/[‘’‚‛′]/g, "'").replace(/ /g, ' ').replace(/[−–]/g, '-').replace(/×/g, '*').replace(/÷/g, '/').replace(/，/g, ',');

    const colNum = s => [...s.toUpperCase()].reduce((n, c) => n * 26 + c.charCodeAt(0) - 64, 0);

    function tokenize(src) {
      const t = []; let i = 0;
      while (i < src.length) {
        const rest = src.slice(i); let m;
        if ((m = rest.match(/^\s+/))) { i += m[0].length; continue; }
        if (rest[0] === '"') {
          m = rest.match(/^"((?:[^"]|"")*)"/);
          if (!m) throw new Stop('parse', 'A text value is missing its closing double quote.');
          t.push({ k: 'str', v: m[1].replace(/""/g, '"') });
        } else if (rest[0] === "'") throw new Stop('singlequote', 'Excel uses double quotes around text: "like this".');
        else if ((m = rest.match(/^\$?([A-Za-z]{1,3})\$?([0-9]+)(?![A-Za-z0-9_(])/))) t.push({ k: 'ref', c: colNum(m[1]), r: +m[2] });
        else if ((m = rest.match(/^(?:\d+(?:\.\d*)?|\.\d+)/))) t.push({ k: 'num', v: +m[0] });
        else if ((m = rest.match(/^[A-Za-z_][A-Za-z0-9_.]*/))) t.push({ k: 'name', v: m[0] });
        else if ((m = rest.match(/^(<>|<=|>=|[-+*\/=<>(),:])/))) t.push({ k: 'op', v: m[0] });
        else if (rest[0] === ';') throw new Stop('parse', 'Separate the parts of a function with commas.');
        else if (rest[0] === '&' || rest[0] === '^' || rest[0] === '%') throw new Stop('unsupported', `Excel may allow ${rest[0]}, but this game does not support it yet.`);
        else throw new Stop('parse', `The formula has a character it can’t read: ${rest[0]}`);
        i += m[0].length;
      }
      return t;
    }

    function parse(src) {
      const t = tokenize(src); let p = 0, depth = 0;
      const peek = () => t[p];
      const isOp = (...v) => !!t[p] && t[p].k === 'op' && v.includes(t[p].v);
      function binary(ops, next) { let a = next(); while (isOp(...ops)) { const op = t[p++].v; a = { k: 'bin', op, a, b: next() }; } return a; }
      const expr = () => { if (++depth > MAX_DEPTH) throw new Stop('parse', 'That formula is nested too deeply.'); const n = binary(['=', '<>', '<', '>', '<=', '>='], addsub); depth--; return n; };
      const addsub = () => binary(['+', '-'], muldiv);
      const muldiv = () => binary(['*', '/'], unary);
      function unary() {
        if (isOp('-', '+')) { const op = t[p++].v; if (++depth > MAX_DEPTH) throw new Stop('parse', 'That formula is nested too deeply.'); const n = { k: 'un', op, a: unary() }; depth--; return n; }
        return primary();
      }
      function primary() {
        const x = peek();
        if (!x) throw new Stop('parse', 'The formula stops early. Something is missing at the end.');
        p++;
        if (x.k === 'num') return { k: 'val', v: x.v };
        if (x.k === 'str') return { k: 'val', v: x.v };
        if (x.k === 'ref') {
          if (x.r < 1) return { k: 'val', v: err('#REF!') };
          if (isOp(':')) {
            p++; const y = t[p++];
            if (!y || y.k !== 'ref' || y.r < 1) throw new Stop('parse', 'A range needs a cell on both sides of the colon.');
            const rg = { r1: Math.min(x.r, y.r), r2: Math.max(x.r, y.r), c1: Math.min(x.c, y.c), c2: Math.max(x.c, y.c) };
            if ((rg.r2 - rg.r1 + 1) * (rg.c2 - rg.c1 + 1) > MAX_CELLS) throw new Stop('parse', 'That range is far bigger than this sheet.');
            return { k: 'range', rg };
          }
          return { k: 'ref', r: x.r, c: x.c };
        }
        if (x.k === 'op' && x.v === '(') {
          const n = expr();
          if (!isOp(')')) throw new Stop('parse', 'A bracket is not closed. Count the ( and ).');
          p++; return n;
        }
        if (x.k === 'name') {
          const up = x.v.toUpperCase();
          if (!isOp('(')) {
            if (up === 'TRUE' || up === 'FALSE') return { k: 'val', v: up === 'TRUE' };
            throw new Stop('unquoted', `Put double quotes around text: "${x.v}". Without them Excel looks for something named ${x.v}.`, '#NAME?');
          }
          if (!Object.prototype.hasOwnProperty.call(ARITY, up)) {
            if (LATER.test(up)) throw new Stop('unsupported', `Excel may allow ${up}, but this game does not support it yet.`);
            throw new Stop('name', `Excel does not know a function named ${up}. Check the spelling.`, '#NAME?');
          }
          p++;
          const args = [];
          if (!isOp(')')) {
            for (;;) {
              if (isOp(',', ')')) throw new Stop('parse', `${up} has an empty part. Check the commas.`);
              args.push(expr());
              if (isOp(',')) { p++; continue; }
              break;
            }
          }
          if (!isOp(')')) throw new Stop('parse', `${up} is missing a comma or its closing bracket.`);
          p++;
          const [lo, hi] = ARITY[up];
          if (up === 'XLOOKUP' && args.length > 4) throw new Stop('unsupported', 'This game supports XLOOKUP’s first four parts only.');
          if (args.length < lo || args.length > hi) throw new Stop('parse', `${up} takes ${lo === hi ? lo : hi === 99 ? 'at least ' + lo : lo + ' to ' + hi} part${hi === 1 ? '' : 's'}. You gave it ${args.length}.`);
          if ((up === 'MATCH' && args.length < 3) || (up === 'VLOOKUP' && args.length < 4)) throw new Stop('exact', exactMsg(up));
          return { k: 'fn', name: up, args };
        }
        throw new Stop('parse', `The formula has a ${x.v} where a value should be.`);
      }
      const tree = expr();
      if (p < t.length) throw new Stop('parse', 'There is extra text after the formula ends. Check the brackets and commas.');
      return tree;
    }
    const exactMsg = f => f === 'MATCH' ? 'Add 0 as the last part of MATCH to ask for an exact match.' : 'Add FALSE as the last part of VLOOKUP to ask for an exact match.';

    function evaluate(tree, grid) {
      const cell = (r, c) => { const row = grid[r - 1]; const v = row ? row[c - 1] : null; return v === undefined || v === '' ? null : v; };
      const rows = rg => rg.r2 - rg.r1 + 1, cols = rg => rg.c2 - rg.c1 + 1;
      const flat = rg => { const out = []; for (let r = rg.r1; r <= rg.r2; r++) for (let c = rg.c1; c <= rg.c2; c++) out.push(cell(r, c)); return out; };
      function ev(n) {
        if (n.k === 'val') return n.v;
        if (n.k === 'ref') return cell(n.r, n.c);
        if (n.k === 'range') return n.rg;
        if (n.k === 'un') { const v = num(ev(n.a)); return isErr(v) ? v : n.op === '-' ? -v : v; }
        if (n.k === 'bin') return bin(n);
        return fn(n);
      }
      function scalar(v) {
        if (!isRange(v)) return v;
        return rows(v) === 1 && cols(v) === 1 ? cell(v.r1, v.c1) : err('#VALUE!');
      }
      function num(v) {
        v = scalar(v);
        if (isErr(v)) return v;
        if (v === null) return 0;
        if (typeof v === 'number') return v;
        if (typeof v === 'boolean') return v ? 1 : 0;
        const s = v.trim();
        return /^[-+]?(\d+(\.\d*)?|\.\d+)$/.test(s) ? +s : err('#VALUE!');
      }
      function text(v) { v = scalar(v); if (isErr(v)) return v; if (v === null) return ''; if (typeof v === 'boolean') return v ? 'TRUE' : 'FALSE'; return String(v); }
      /* Excel order: numbers, then text, then TRUE/FALSE. Text comparison ignores case. */
      function compare(a, b) {
        if (a === null) a = typeof b === 'string' ? '' : typeof b === 'boolean' ? false : 0;
        if (b === null) b = typeof a === 'string' ? '' : typeof a === 'boolean' ? false : 0;
        const rank = v => typeof v === 'number' ? 0 : typeof v === 'string' ? 1 : 2;
        if (rank(a) !== rank(b)) return rank(a) - rank(b);
        if (typeof a === 'string') { a = a.toLowerCase(); b = b.toLowerCase(); }
        return a < b ? -1 : a > b ? 1 : 0;
      }
      function bin(n) {
        if (['+', '-', '*', '/'].includes(n.op)) {
          const a = num(ev(n.a)); if (isErr(a)) return a;
          const b = num(ev(n.b)); if (isErr(b)) return b;
          if (n.op === '/' && b === 0) return err('#DIV/0!');
          return n.op === '+' ? a + b : n.op === '-' ? a - b : n.op === '*' ? a * b : a / b;
        }
        const a = scalar(ev(n.a)); if (isErr(a)) return a;
        const b = scalar(ev(n.b)); if (isErr(b)) return b;
        const d = compare(a, b);
        return n.op === '=' ? d === 0 : n.op === '<>' ? d !== 0 : n.op === '<' ? d < 0 : n.op === '>' ? d > 0 : n.op === '<=' ? d <= 0 : d >= 0;
      }
      const same = (a, b) => a !== null && typeof a === typeof b && (typeof a === 'string' ? a.toLowerCase() === b.toLowerCase() : a === b);
      const line = v => isRange(v) && (rows(v) === 1 || cols(v) === 1);
      function criteria(c) {
        const m = typeof c === 'string' ? c.match(/^(<>|<=|>=|=|<|>)([\s\S]*)$/) : null;
        const op = m ? m[1] : '=';
        let want = m ? m[2] : c === null ? '' : c;
        if (typeof want === 'string' && /^\s*[-+]?(\d+(\.\d*)?|\.\d+)\s*$/.test(want)) want = +want;
        if (op === '=' || op === '<>') {
          let test;
          if (typeof want === 'string') {
            const re = new RegExp('^' + [...want].map(ch => ch === '*' ? '[\\s\\S]*' : ch === '?' ? '[\\s\\S]' : ch.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('') + '$', 'i');

      save.done.push(i); save.done.sort((a, b) => a - b);
      if (firstTry) {
        save.first.push(i); save.first.sort((a, b) => a - b);
        save.streak += 1; save.best = Math.max(save.best, save.streak);
        if (save.streak >= 3) note = `${save.streak} first-try wins in a row. `;
      }
    }
    persist(); stopTimer();
    ui.fb = { kind: 'ok', msg: note + l.success };
    render(); focusSel('#dock .cont');
    confetti(fresh && note ? 60 : 28);
    say('Correct. ' + note + l.success);
  }
  function missed(msg) {
    const i = ui.lesson;
    logAttempt(false); persist();
    ui.misses += 1;
    if (!save.done.includes(i)) { ui.missed.add(i); if (save.streak) { save.streak = 0; persist(); } }
    ui.fb = { kind: 'bad', msg };
    render(); focusSel('#dock .cont');
    say('Not yet. ' + msg);
  }

  /* Run the formula on the visible sheet, then on each hidden copy. */
  function gradeFormula(l, raw) {
    if (!XL.clean(raw).startsWith('=')) return { ok: false, shown: null, msg: 'Every Excel formula starts with the = sign. Without it, Excel keeps your typing as plain text. Add = at the front.' };
    const got = XL.run(raw, SHEET);
    if (got.stop) return { ok: false, shown: got.stop.code || null, msg: got.stop.msg };
    const shown = XL.show(got.value), want = XL.run(l.key, SHEET).value;
    if (!XL.equal(got.value, want)) {
      if (typeof want === 'string' && typeof got.value === 'string' && got.value.replace(/\s+/g, '').toLowerCase() === want.toLowerCase()) return { ok: false, shown, msg: 'Close. Excel shows your text exactly as typed, so check capital letters and spaces inside the quotes.' };
      if (XL.isErr(got.value)) {
        const tips = { '#DIV/0!': 'Something is divided by zero.', '#N/A': 'The value you looked for was not found. Check the spelling and the range.', '#NAME?': 'Excel does not know one of the names.', '#VALUE!': 'A part has the wrong kind of value, such as text where a number is needed.', '#REF!': 'The formula points outside its range.' };
        return { ok: false, shown, msg: `${shown}: ${tips[got.value.err] || ''} ${l.fail}` };
      }
      return { ok: false, shown, msg: l.fail };
    }
    for (const g of l.variants) {
      const v = XL.run(raw, g);
      if (v.stop || !XL.equal(v.value, XL.run(l.key, g).value)) return { ok: false, shown, msg: l.variantFail || 'Right today, but not if the numbers change. Point the formula at the cells instead of typing values.' };
    }
    return { ok: true, shown, msg: '' };
  }
  function check() {
    const l = L();
    if (ui.fb) return;
    if (l.mode === 'buttons') {
      if (!ui.pick) { say('Pick an answer first.'); return; }
      return ui.pick === l.answer ? solved() : missed(l.fail);
    }
    const raw = (($('q') || {}).value || '').trim();
    ui.draft = raw;
    if (!raw) { say(l.mode === 'formula' ? 'Type a formula first.' : 'Write your sentence first.'); focusSel('#q'); return; }
    if (l.mode === 'text') return l.validate(raw) ? solved() : missed(l.fail);
    const r = gradeFormula(l, raw);
    ui.lastRes = r.shown;
    if (r.shown !== null) say('Your formula returns ' + r.shown);
    if (r.ok) solved(); else missed(r.msg);
    /* Keep the result line visible above the feedback panel. */
    const line = $('result'); if (line && line.scrollIntoView) line.scrollIntoView({ block: 'center' });
  }

  /* ── Effects ── */
  function confetti(n) {
    if (reduce()) return;
    const fx = $('fx'), f = flavor(), cols = [f.a, f.b, f.c, '#9ad466', '#ffd27a'];
    fx.innerHTML = '';
    for (let k = 0; k < n; k++) {
      const p = document.createElement('i'); p.className = 'pt'; p.style.background = cols[k % cols.length];
      p.style.setProperty('--dx', ((Math.random() - .5) * 520) + 'px'); p.style.setProperty('--dy', ((Math.random() - .5) * 380) + 'px');
      fx.appendChild(p);
    }
    setTimeout(() => { fx.innerHTML = ''; }, 1000);
  }
  function brew(manual) {
    ui.beans += 1;
    if (ui.beans % 3 === 0) { save.served += 1; persist(); }
    if (ui.screen !== 'lunch') return;
    const vibe = save.served >= 15 ? 'Excellent' : save.served >= 5 ? 'Lighter' : 'Calm';
    $('lbC').textContent = ui.beans; $('lbS').textContent = save.served; $('lbV').textContent = vibe;
    if (manual && !reduce()) {
      const b = document.createElement('div'); b.className = 'bean';
      b.style.left = (20 + Math.random() * 60) + '%'; b.style.top = (14 + Math.random() * 30) + '%';
      $('coffee').appendChild(b); setTimeout(() => b.remove(), 700);
    }
  }
  function setHelper(on) {
    ui.helper = on;
    if (helperTimer) { clearInterval(helperTimer); helperTimer = null; }
    if (on) helperTimer = setInterval(() => brew(false), 2000);
  }

  /* ── Events ── */
  function act(a, el) {
    switch (a) {
      case 'glossary': ui.back = 'home'; ui.gOpen = null; ui.gq = ''; go('glossary'); break;
      case 'explain': ui.back = ui.screen; if (ui.screen === 'question') ui.draft = (($('q') || {}).value) || ui.draft; ui.gOpen = L().prereq; ui.gq = ''; go('glossary'); break;
      case 'back': go(ui.back && ui.screen === 'glossary' ? ui.back : 'home'); break;
      case 'quit': ui.fb = null; stopTimer(); go('home'); break;
      case 'continue': { const n = nextIdx(); if (n < 0) { ui.back = 'home'; go('done'); } else openLesson(n); break; }
      case 'open': openLesson(+el.dataset.i); break;
      case 'start': go('question'); startTimer(); break;
      case 'pick': if (ui.fb) return; ui.pick = ui.order[+el.dataset.k]; render(); focusSel(`[data-act="pick"][data-k="${el.dataset.k}"]`); break;
      case 'check': check(); break;
      case 'retry': ui.fb = null; if (L().mode === 'buttons') ui.pick = null; render(); focusSel(L().mode === 'buttons' ? '.opt' : '#q'); break;
      case 'next': if (ui.lesson >= lessons.length - 1) { ui.back = 'home'; go('done'); confetti(80); } else openLesson(ui.lesson + 1); break;
      case 'toggleAll': { ui.allOpen = !ui.allOpen; $('allList').hidden = !ui.allOpen; el.setAttribute('aria-expanded', String(ui.allOpen)); break; }
      case 'toggleMore': { ui.moreOpen = !ui.moreOpen; $('moreList').hidden = !ui.moreOpen; el.setAttribute('aria-expanded', String(ui.moreOpen)); break; }
      case 'toggleAbout': { ui.aboutOpen = !ui.aboutOpen; $('aboutBody').hidden = !ui.aboutOpen; el.setAttribute('aria-expanded', String(ui.aboutOpen)); break; }
      case 'palette': { ui.paletteOpen = !ui.paletteOpen; $('palette').hidden = !ui.paletteOpen; el.setAttribute('aria-expanded', String(ui.paletteOpen)); if (ui.paletteOpen) focusSel(`[data-f="${theme.flavor}"]`); break; }
      case 'flavor': theme.flavor = el.dataset.f; saveTheme(); applyLook(); render(); focusSel(`[data-f="${theme.flavor}"]`); say(flavor().name); break;
      case 'lights': theme.mode = theme.mode === 'dark' ? 'light' : 'dark'; theme.saved = true; saveTheme(); applyLook(); render(); focusSel('[data-act="lights"]'); say(theme.mode === 'dark' ? 'Dark mode on' : 'Dark mode off'); break;
      case 'screen': ui.back = 'home'; go(el.dataset.s); break;
      case 'gclear': ui.gq = ''; $('gq').value = ''; filterGlossary(); $('gq').focus(); break;
      case 'reset':
        if (!ui.resetArm) { ui.resetArm = true; render(); focusSel('[data-act="reset"]'); say('Tap again to reset your progress.'); }
        else { const keep = { na: save.na, nr: save.nr }; save = Object.assign(defaults(), keep); persist(); ui.missed.clear(); ui.resetArm = false; render(); focusSel('#screen h1'); say('Progress reset.'); }
        break;
      case 'brew': brew(true); break;
      case 'csv': {
        const t = myTables().find(x => x[0] === el.dataset.t); const text = csvOf(t[1], t[2]);
        ui.csv = { t: t[0], text }; render(); const d = document.querySelector(`details[data-t="${t[0]}"]`); if (d) d.open = true;
        try { navigator.clipboard.writeText(text).then(() => say(t[0] + '.csv copied'), () => say('Select the text to copy it.')); } catch (e) { say('Select the text to copy it.'); }
        break;
      }
      case 'helper': setHelper(!ui.helper); render(); focusSel('[data-act="helper"]'); break;
    }
  }
  document.addEventListener('click', e => {
    const g = e.target.closest('[data-ga="book"]'); if (g && window.gtag) window.gtag('event', 'book_click', { from: 'prep-companion-excel' });
    if (e.target.closest('a')) return;
    const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
    act(b.dataset.act, b);
  });
  document.addEventListener('input', e => {
    if (e.target.id === 'q') ui.draft = e.target.value;
    if (e.target.id === 'gq') { ui.gq = e.target.value; filterGlossary(); }
  });
  document.addEventListener('keydown', e => {
    if (e.target.id === 'q' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); check(); }
  });

  /* ── Start ── */
  applyLook();
  render();
  window.__excelSprint = { VERSION, STORY, UNITS, lessons, glossary, SHEET, XL, KEY, THEME_KEY, OLD_THEME_KEY, ui, get save() { return save; }, gradeFormula, nextIdx, T };
})();
</script>
<script>
/* candy color tip v1: shown under the open palette until the visitor taps Got it or picks a color/mode. Shared key candy.hint.v1 = "1". */
(function(){
  var K='candy.hint.v1',h=document.getElementById('palhint');if(!h)return;
  var pid=h.getAttribute('data-for')||'palette',seen=false;
  try{seen=localStorage.getItem(K)==='1'}catch(e){}
  function sync(){var p=document.getElementById(pid),show=!seen&&!!p&&!p.hidden&&p.offsetParent!==null;
    if(p&&p.nextElementSibling!==h)p.after(h);if(h.hidden===show)h.hidden=!show}
  function done(){if(seen)return;seen=true;try{localStorage.setItem(K,'1')}catch(e){}sync()}
  document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('button');if(b&&(h.contains(b)||b.closest('#'+pid)))done()},true);
  if(window.MutationObserver)new MutationObserver(sync).observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['hidden','class']});
  sync();
})();
</script>
